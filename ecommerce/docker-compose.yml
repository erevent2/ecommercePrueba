services:
  # 1. Base de Datos
  postgres-db:
    image: postgres:15-alpine
    container_name: blossom_db
    environment:
      POSTGRES_DB: blossom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend (Spring Boot)
  backend:
    build: 
      context: ./ecommerce # Ruta a la carpeta del backend
    container_name: blossom_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/blossom_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - APP_CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
    depends_on:
      postgres-db:
        condition: service_healthy

  # 3. Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend/frontend # Ruta a la carpeta frontend
    container_name: blossom_frontend
    ports:
      - "80:80" # Mapeamos el puerto 80 de Nginx al puerto 80 de la máquina
    depends_on:
      - backend

volumes:
  postgres_data: